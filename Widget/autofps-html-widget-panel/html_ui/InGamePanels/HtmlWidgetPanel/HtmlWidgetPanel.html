<!DOCTYPE html>
<html>
<head>
	<title>AutoFPS</title>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="/SCSS/common.css" />
	<link rel="stylesheet" href="HtmlWidgetPanel.css" />
	<script type="text/javascript" src="/JS/coherent.js"></script>
	<script type="text/javascript" src="/JS/common.js"></script>
	<script type="text/javascript" src="/JS/buttons.js"></script>
	<script type="text/javascript" src="/JS/dataStorage.js"></script>
	<script type="text/javascript" src="/JS/simvar.js"></script>
	<script type="text/javascript" src="/JS/Services/CommBus.js"></script>
	<script type="text/javascript" src="/JS/Services/ToolBarPanels.js"></script>
	<script type="text/javascript" src="/Pages/VCockpit/Instruments/Shared/BaseInstrument.js"></script>
	<link rel="import" href="/templates/ingameUi/ingameUi.html" />
	<link rel="import" href="/templates/ingameUiHeader/ingameUiHeader.html" />
	<script type="text/javascript" src="HtmlWidgetPanel.js"></script>
</head>
<body class="border-box">
	<ingamepanel-html-widget>
		<!-- panel-id MUST match the id= in InGamePanel_HtmlWidgetPanel.xml -->
		<ingame-ui id="HtmlWidgetPanel" panel-id="HTML_WIDGET_PANEL" title="AutoFPS" class="ingameUiFrame panelInvisible" content-fit="true" resize="x" min-width="420" min-height="300">
			<section id="mainSection" class="main-sect">
				<div id="widget-toolbar">
					<div id="toolbar-left">
						<span id="widget-title" class="hidden">MSFS_AutoFPS</span>
						<span id="widget-status">Starting...</span>
					</div>
					<div class="hotkey-group hidden" style="display: none !important;">
						<span class="hotkey-label">Show/Hide</span>
						<button type="button" id="widget-hotkey-btn" title="Click, then press a key combo to set a show/hide hotkey">No Hotkey</button>
					</div>
					<div class="auto-hide-group hidden" id="autoHideGroup">
						<span class="auto-hide-label" id="autoHideLabel">Auto-Hide</span>
						<div id="autoHideDropdown" class="custom-select">
							<button type="button" id="autoHideBtn" class="custom-select-btn">-</button>
							<div id="autoHideList" class="custom-select-list hidden"></div>
						</div>
					</div>
					<button type="button" id="widget-close-btn" title="Close">X</button>
				</div>				<div id="widget-content" class="hidden">
					<!-- Box 1: Status -->
					<fieldset id="connStatusBox" class="group-box">
						<legend class="group-header">Connection Status</legend>
						<div class="conn-row">
							<span id="connMSFS" class="status-badge status-red">MSFS</span>
							<span id="connSimConnect" class="status-badge status-red">SimConnect</span>
							<span id="connSession" class="status-badge status-red">Session</span>
						</div>
					</fieldset>

					<!-- Box 2: Sim Values (Moved Above General) -->
					<fieldset class="group-box">
						<legend class="group-header">
							<img id="imgSimHeaderFS" class="header-icon" src="img/fps_msfs.png" alt="FS" style="display: none;" />
							<img id="imgSimHeaderDog" class="header-icon" src="img/autofps.png" alt="AutoFPS" style="display: none;" />
							<span>Sim Values</span>
						</legend>
						<div class="sim-grid">
							<span id="lblFps" class="label">FPS+:</span>
							<span class="val fps-val-container"><span id="valFps">n/a</span><img id="imgFpsSource" class="fps-source-icon" src="" alt="" style="display: none;" /></span>
							<span id="lblTlod" class="label">TLOD:</span>
							<span id="valTlod" class="val">n/a</span>
							<span id="lblOlod" class="label">OLOD:</span>
							<span id="valOlod" class="val">n/a</span>

							<span id="lblAgl" class="label">AGL:</span>
							<span id="valAgl" class="val">n/a</span>
							<span id="lblFpm" class="label">FPM:</span>
							<span id="valFpm" class="val">n/a</span>
							<span id="lblClouds" class="label">Clouds:</span>
							<span id="valClouds" class="val">n/a</span>
						</div>
					</fieldset>

					<!-- Box 3: General -->
					<fieldset class="group-box">
						<legend id="generalHeader" class="group-header collapsible-header" title="Click to show/hide controls">
							General <span id="generalChevron" class="chevron"><svg viewBox="0 0 10 10"><polygon points="1,1 9,1 5,9" fill="currentColor" /></svg></span>
						</legend>

						<!-- Wrapper for collapsible controls -->
						<div id="generalControls">
							<!-- Row 1: Mode / Target / FPS / Dark -->
							<div class="controls-row target-row">
								<div id="modeDropdown" class="custom-select">
									<button type="button" id="modeBtn" class="custom-select-btn">-</button>
									<div id="modeList" class="custom-select-list hidden"></div>
								</div>
								<span class="label">Target</span>
								<div id="targetDropdown" class="custom-select">
									<button type="button" id="targetBtn" class="custom-select-btn">-</button>
									<div id="targetList" class="custom-select-list target-list hidden"></div>
								</div>
								<div id="fpsGroup" class="fps-group">
									<span class="label">FPS</span>
									<div class="stepper">
										<button type="button" id="fpsDecBtn" class="stepper-btn" title="Decrease target FPS (hold to speed up)"><svg viewBox="0 0 10 10"><rect x="1" y="4.2" width="8" height="1.6" fill="currentColor" /></svg></button>
										<span id="fpsVal" class="stepper-val">-</span>
										<button type="button" id="fpsIncBtn" class="stepper-btn" title="Increase target FPS (hold to speed up)"><svg viewBox="0 0 10 10"><rect x="1" y="4.2" width="8" height="1.6" fill="currentColor" /><rect x="4.2" y="1" width="1.6" height="8" fill="currentColor" /></svg></button>
									</div>
								</div>
								<label id="darkModeLabel" class="chk-label">
									<input type="checkbox" id="darkModeChk" class="chk-input-native" />
									<span class="custom-checkbox" aria-hidden="true"></span>
									<span>Dark</span>
								</label>
							</div>

							<!-- Row 2: Expert / Log+ / Reset / Flight Type -->
							<div class="controls-row general-row-2">
								<label id="expertLabel" class="chk-label">
									<input type="checkbox" id="expertChk" class="chk-input-native" />
									<span class="custom-checkbox" aria-hidden="true"></span>
									<span>Expert</span>
								</label>
								<label id="logPlusLabel" class="chk-label">
									<input type="checkbox" id="logPlusChk" class="chk-input-native" />
									<span class="custom-checkbox" aria-hidden="true"></span>
									<span>Log+</span>
								</label>
								<button type="button" id="resetBtn">Reset</button>
								<div class="flight-type-group">
									<span class="label">Flight Type</span>
									<div id="flightTypeDropdown" class="custom-select">
										<button type="button" id="flightTypeBtn" class="custom-select-btn">-</button>
										<div id="flightTypeList" class="custom-select-list hidden"></div>
									</div>
								</div>
							</div>
						</div>

						<!-- Status message remains visible at all times -->
						<div id="statusMessage" class="status-msg">n/a</div>
					</fieldset>
				</div>
			</section>
		</ingame-ui>
	</ingamepanel-html-widget>
</body>
</html>
